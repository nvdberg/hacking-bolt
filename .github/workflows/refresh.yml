name: Hacking-Bolt refresh

on:
  schedule:
    # Hourly RESTART only — each run self-loops internally (LOOP_MINUTES) polling every ~90s. The loop
    # slightly overruns the hour so the next run queues (concurrency) and starts gaplessly. GitHub cron
    # can't do sub-5-min reliably, so tight cadence comes from the in-run loop, not the schedule.
    - cron: "23 * * * *"
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: hacking-bolt
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # a bit over LOOP_MINUTES so a hung browser can't hold a slot for hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # cache the chromium download so runs stay ~1 minute
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      # persist the logged-in session + roster + last shifts between runs (no re-login, fast diff)
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: |
            state.json
            roster.json
            site/shifts.json
          key: hb-state-${{ github.run_id }}
          restore-keys: hb-state-

      - name: Install
        working-directory: stage2
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The APNs .p8 is stored as single-line base64 (multiline secrets get mangled through paste/CI).
      # Decode it to a file the poller reads via APNS_KEY_PATH.
      - name: Write APNs key
        env:
          APNS_KEY_P8_B64: ${{ secrets.APNS_KEY_P8 }}
        run: printf '%s' "$APNS_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/apns.p8"

      - name: Scrape + notify
        working-directory: stage2
        env:
          LB_USER: ${{ secrets.LB_USER }}
          LB_PASS: ${{ secrets.LB_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE_FILE: ${{ github.workspace }}/state.json
          ROSTER_FILE: ${{ github.workspace }}/roster.json
          OUT_DIR: ${{ github.workspace }}/site
          # --- Working-Bolt backend (Options 2 & 3) ---
          # Public identifiers (safe to hardcode):
          SUPABASE_URL: https://qbtnxkzpddexczhcvxre.supabase.co
          APNS_KEY_ID: XK4SN3UC87
          APNS_TEAM_ID: RF4R5X25Y2
          APNS_BUNDLE_ID: com.nvdberg.hackingbolt
          # Real secrets (add these two in repo Settings → Secrets → Actions):
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APNS_KEY_PATH: ${{ runner.temp }}/apns.p8
          # Self-loop for tight cadence: poll every 90s for 65 min, then the next hourly run takes over.
          LOOP_MINUTES: "65"
          LOOP_EVERY_S: "90"
        run: node run.mjs
