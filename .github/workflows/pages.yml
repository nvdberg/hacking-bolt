name: Working-Bolt web (Pages)

# Publishes ONLY the web/ folder (landing page + wb.js + icons) to https://nvdberg.github.io/hacking-bolt/.
# No roster data, names or secrets live in web/ — everything personal is read live in the user's own browser.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          cp web/index.html web/wb.js web/icon.png web/apple-touch-icon.png _site/
          [ -f web/sw.js ] && cp web/sw.js _site/ || true
          [ -f web/manifest.json ] && cp web/manifest.json _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
