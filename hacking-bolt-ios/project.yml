name: HackingBolt
options:
  bundleIdPrefix: com.nvdberg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  HackingBolt:
    type: application
    platform: iOS
    sources:
      - HackingBolt
    entitlements:
      path: HackingBolt/HackingBolt.entitlements
      properties:
        aps-environment: development   # Xcode auto-swaps to "production" for TestFlight/App Store archives
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nvdberg.hackingbolt
        DEVELOPMENT_TEAM: RF4R5X25Y2
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "73"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-only (portrait app) → avoids iPad multitasking orientation rules
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES   # exposes AppIcon-Neon/-Gold/-Red as alternate icons
        INFOPLIST_KEY_CFBundleDisplayName: Working-Bolt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"   # only standard HTTPS → skips TestFlight's export-compliance prompt
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlocks your saved Lightning Bolt sign-in so Working-Bolt can sign you back in automatically when your session expires."
